# Jekyll config for GitHub Pages.
#
# Only index.html and shared/*.html are served publicly.
# Everything else is excluded to prevent leaking package.json,
# node_modules, scripts, etc.
exclude:
  - docs/
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - scripts/
  - server/
  - .claude/
  - .clever/
